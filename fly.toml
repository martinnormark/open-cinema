# Fly.io deployment. See docs/deployment.md#flyio.
# Secrets (COMFY_API_KEY, BASIC_AUTH_PASSWORD) are set with `fly secrets set`.
app = "open-cinema"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = 45

[build]
  dockerfile = "Dockerfile"
  build-target = "fly"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  DATA_DIR = "/data"
  AUTH_MODE = "public"
  BASIC_AUTH_USER = "studio"
  APP_ORIGIN = "https://open-cinema.fly.dev"
  MAX_ACTIVE_JOBS = "1"

# One machine per volume: the catalog, checkpoints and media live here.
[mounts]
  source = "studio_data"
  destination = "/data"
  initial_size = "10gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Job coordinators run in-process, so keep the machine up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
