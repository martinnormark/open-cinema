name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run format:check
      - run: bun run check
      - run: docker compose config --quiet
      - run: docker build -t open-cinema:ci .
      - run: bun scripts/docker-smoke.ts open-cinema:ci
